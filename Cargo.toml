[workspace]
resolver = "3"
members = ["crates/asteroid-core", "crates/asteroid-sync", "crates/asteroid-git", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
asteroid-core = { path = "crates/asteroid-core" }
asteroid-sync = { path = "crates/asteroid-sync" }
asteroid-git = { path = "crates/asteroid-git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
