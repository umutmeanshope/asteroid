# Builds installers for Linux, Windows and macOS and attaches them to a draft
# GitHub Release. Run it by pushing a version tag:
#
#   node scripts/bump-version.mjs 0.2.0 && git commit -am "Release 0.2.0"
#   git tag v0.2.0 && git push origin main v0.2.0
#
# then review the draft on the Releases page and publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-22.04 # older glibc, so the bundles run on more distros
            args: ""
          - name: Windows
            runner: windows-latest
            args: ""
          - name: macOS (Apple Silicon)
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            runner: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: built-in OAuth client IDs so sign-in works without users
          # creating their own (Settings › Secrets and variables › Actions).
          ASTEROID_GOOGLE_CLIENT_ID: ${{ secrets.ASTEROID_GOOGLE_CLIENT_ID }}
          ASTEROID_GOOGLE_CLIENT_SECRET: ${{ secrets.ASTEROID_GOOGLE_CLIENT_SECRET }}
          ASTEROID_GITHUB_CLIENT_ID: ${{ secrets.ASTEROID_GITHUB_CLIENT_ID }}
        with:
          tagName: v__VERSION__
          releaseName: Asteroid v__VERSION__
          releaseBody: |
            Download the installer for your system below. See the README for install notes (the builds aren't code-signed yet, so macOS and Windows show a one-time warning).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
