[package]
name = "asteroid-git"
description = "Git sync for vaults (commit, fetch, merge, push) and GitHub sign-in"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest = { version = "0.13", features = ["json", "form", "query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
walkdir = "2"
# Vendored libgit2 and OpenSSL are compiled in, so the app never links whatever
# versions the build machine has installed: a .deb built against the distro's
# libgit2 1.9 wouldn't start on systems shipping another version. (macOS and
# Windows use their native TLS and ignore vendored-openssl.)
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

[dev-dependencies]
tempfile = "3"
